name: Update GitHub Activity Card

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate activity card
        env:
          GITHUB_USERNAME: reettginotra
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          OUTPUT_PATH: assets/github-activity-card.svg
        run: node .github/scripts/generate-github-activity.mjs

      - name: Commit updated card
        run: |
          if git diff --quiet -- assets/github-activity-card.svg; then
            echo "No activity card changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity-card.svg
          git commit -m "chore: update GitHub activity card"
          git push

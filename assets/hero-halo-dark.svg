<svg xmlns="http://www.w3.org/2000/svg" width="620" height="146" viewBox="0 0 620 146" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Reet Ginotra hero halo</title>
  <desc id="desc">Centered name with a subtle animated blue to teal halo and subtitle on a transparent background.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.26">
        <animate attributeName="stop-color" values="#7DD3FC;#5EEAD4;#7DD3FC" dur="6s" repeatCount="indefinite" />
        <animate attributeName="stop-opacity" values="0.26;0.32;0.26" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="58%" stop-color="#7DD3FC" stop-opacity="0.16">
        <animate attributeName="stop-color" values="#7DD3FC;#5EEAD4;#7DD3FC" dur="6s" repeatCount="indefinite" />
        <animate attributeName="stop-opacity" values="0.16;0.2;0.16" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0">
        <animate attributeName="stop-color" values="#7DD3FC;#5EEAD4;#7DD3FC" dur="6s" repeatCount="indefinite" />
      </stop>
    </radialGradient>
    <filter id="blur" x="-100%" y="-220%" width="300%" height="420%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="26" />
    </filter>
  </defs>
  <g filter="url(#blur)" transform="translate(310 62)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="0.96 0.92;1.04 1.08;0.96 0.92" dur="6s" repeatCount="indefinite" />
      <ellipse cx="0" cy="0" rx="190" ry="54" fill="url(#halo)" opacity="1">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="6s" repeatCount="indefinite" />
      </ellipse>
      <ellipse cx="0" cy="0" rx="126" ry="28" fill="url(#halo)" opacity="0.72">
        <animate attributeName="opacity" values="0.64;0.8;0.64" dur="6s" repeatCount="indefinite" />
      </ellipse>
    </g>
  </g>
  <text x="310" y="76" text-anchor="middle" fill="#E6EDF3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="0.2">Reet Ginotra</text>
  <text x="310" y="101" text-anchor="middle" fill="#9FB0C2" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="500" letter-spacing="0.3">Full stack developer · AI · Product</text>
</svg>

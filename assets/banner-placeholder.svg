<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04111d" />
      <stop offset="45%" stop-color="#0f3d56" />
      <stop offset="100%" stop-color="#0b6e6b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.5" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF10" stroke-width="1" />
    </pattern>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="300" rx="20" fill="url(#grid)" />

  <circle cx="210" cy="70" r="150" fill="#38bdf8" fill-opacity="0.22" filter="url(#blurGlow)" />
  <circle cx="960" cy="230" r="180" fill="#2dd4bf" fill-opacity="0.18" filter="url(#blurGlow)" />
  <circle cx="1060" cy="70" r="110" fill="#7dd3fc" fill-opacity="0.12" filter="url(#blurGlow)" />

  <path d="M0 220C120 190 210 180 310 192C410 204 495 239 604 239C721 239 793 184 898 174C1020 162 1101 196 1200 218V300H0V220Z" fill="#FFFFFF0D" />
  <path d="M80 244H1120" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round" />

  <g>
    <rect x="442" y="52" width="316" height="34" rx="17" fill="#FFFFFF14" stroke="#7DD3FC40" />
    <text x="600" y="74" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" fill="#BAE6FD">SOFTWARE | AI | PRODUCT</text>

    <text x="600" y="146" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.6" fill="url(#textGrad)">REET GINOTRA</text>

    <text x="600" y="188" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#E0F2FE">Full Stack Developer building useful systems end to end</text>
    <text x="600" y="220" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#CCFBF1">Focused on practical products, clean engineering, and real-world impact</text>

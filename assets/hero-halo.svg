<svg xmlns="http://www.w3.org/2000/svg" width="620" height="140" viewBox="0 0 620 140" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Reet Ginotra profile heading</title>
  <desc id="desc">Centered profile name and subtitle on a transparent background.</desc>
  <defs>
    <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.22">
        <animate attributeName="stop-color" values="#7DD3FC;#5EEAD4;#7DD3FC" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="310" cy="70" rx="150" ry="55" fill="url(#haloGrad)" filter="url(#soft-blur)"/>
  <text x="310" y="69" text-anchor="middle" fill="#0F172A" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="0.2">Reet Ginotra</text>
  <text x="310" y="92" text-anchor="middle" fill="#475569" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="500" letter-spacing="0.28">Full stack developer &#183; AI &#183; Product</text>
</svg>
